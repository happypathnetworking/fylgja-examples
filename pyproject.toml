# The uv workspace of one member, the example orchestrator, and no distribution itself: uv's tables alone. The member's
# pyproject.toml states its pins, the three published distributions at VERSION; uv.lock is derived from them
# (`uv lock`) and `make venv` refuses it where it disagrees. infrahub/ and netbox/ hold pytest's settings alone and are
# no members.
[tool.uv]
required-version = "==0.12.23"
python-downloads = "never"
python-preference = "only-system"

[tool.uv.workspace]
members = ["orchestrator"]

# The candidate's lock: the three fylgja distributions come from TestPyPI and everything else from PyPI. The index is
# explicit, so only a distribution a source names is looked up there. 1.1.0's commit takes both tables out.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
explicit = true

[tool.uv.sources]
fylgja-core = { index = "testpypi" }
fylgja-infrahub = { index = "testpypi" }
fylgja-netbox = { index = "testpypi" }
