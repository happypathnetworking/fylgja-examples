# The uv workspace of one member, the example orchestrator, and no distribution itself: uv's tables alone. The member's
# pyproject.toml states its pins, the three published distributions at VERSION; uv.lock is derived from them
# (`uv lock`) and `make venv` refuses it where it disagrees. infrahub/ and netbox/ hold pytest's settings alone and are
# no members.
[tool.uv]
required-version = "==0.12.23"
python-downloads = "never"
python-preference = "only-system"

[tool.uv.workspace]
members = ["orchestrator"]
